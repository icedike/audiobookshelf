services:
  audiobookshelf_custom:
    image: audiobookshelf_custom
    container_name: audiobookshelf_custom
    build:
      context: .
    ports:
      - 3042:80
    volumes:
      - /home/chris/audiobookshelf/audiobooks:/audiobooks
      - /home/chris/audiobookshelf/podcasts:/podcasts
      - /home/chris/audiobookshelf/metadata:/metadata
      - /home/chris/audiobookshelf/config:/config
    environment:
      - TZ=Asia/Taipei
      - ROUTER_BASE_PATH=/ai
    restart: always
